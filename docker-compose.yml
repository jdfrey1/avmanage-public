name: avmanage

# =============================================================================
# Production stack — runs the pre-built image from the GitHub Container Registry.
#
# Set these in a .env file next to this file (see .env.example) or in your stack
# manager (e.g. Portainer → Stacks → Environment variables):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   SESSION_SECRET    — openssl rand -hex 32
#   COOKIE_SECURE     — true when served over HTTPS
#   DATA_PATH         — host folder for the database, uploads and backups (default ./data)
# Optional: PUBLIC_URL, APP_TIMEZONE, ANTHROPIC_API_KEY, FLIGHTAWARE_API_KEY,
#           GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_CALENDAR_ID, IMAGE_TAG, IMAGE_NAME
#
# The app creates and upgrades the database schema itself on startup.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application — serves the React PWA and Express API
  # ---------------------------------------------------------------------------
  app:
    image: ${IMAGE_NAME:-ghcr.io/jdfrey1/avmanage-public}:${IMAGE_TAG:-latest}
    container_name: avmanage-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3022

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      UPLOADS_DIR: /data/uploads

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}

    volumes:
      - ${DATA_PATH:-./data}/uploads:/data/uploads
      - ${DATA_PATH:-./data}/backups:/data/backups

    ports:
      - "3022:3022"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3022/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Database — Postgres 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: avmanage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_PATH:-./data}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
